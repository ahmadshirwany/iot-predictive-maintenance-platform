[project]
name = "iot-pdm-platform"
version = "0.1.0"
requires-python = ">=3.11"
 
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
 
[tool.setuptools.packages.find]
where = ["src"]
 
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
 
[tool.ruff]
line-length = 100
 
[tool.ruff.lint]
select = ["E", "F", "I"]   # errors, pyflakes, import sorting
